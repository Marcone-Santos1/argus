# Argus: configuração do tmux. Gerado por `argus install`; não editar.
# Servidor próprio (tmux -L argus): não interfere com outro tmux.

# Sem prefixo e sem barra: o único atalho global é Ctrl+\.
set -g prefix None
unbind C-b
set -g status off

# Comportamento do terminal igual ao de fora do tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 0
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g bell-action any
set -g focus-events on
set -g history-limit 50000
set -g window-size latest

# Nomes de janela fixos (o Argus identifica as janelas pelo nome).
set -g automatic-rename off
set -g allow-rename off

# Painel e espaço vazio à direita.
set -g remain-on-exit-format "#[fg=colour244]  Nenhuma sessão aberta aqui. Escolha uma na lista ou aperte n."
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour75"

# Ctrl+\ alterna o foco entre a lista e a sessão (e sai da tela cheia).
bind -n C-\\ if -F "#{==:#{@argus_role},panel}" "select-pane -t :main.1" "select-pane -t :main.0"

# Quando uma sessão termina, avisa o painel (um sh por evento, sem programas externos).
set-hook -g pane-exited "run-shell -b 'echo 1 > __STATE_DIR__/_tmux'"
set-hook -g pane-died "run-shell -b 'echo 1 > __STATE_DIR__/_tmux'"
