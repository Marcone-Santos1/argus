# Argus tmux configuration. Written by `argus install`; do not edit.
# Its own server (tmux -L argus): it does not interfere with any other tmux.

# No prefix and no status bar: the only global key is Ctrl+\.
set -g prefix None
unbind C-b
set -g status off

# The terminal behaves as it does outside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 0
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g bell-action any
set -g focus-events on
set -g history-limit 50000
set -g window-size latest

# Fixed window names (Argus finds windows by name).
set -g automatic-rename off
set -g allow-rename off

# Panel and the empty space on the right.
set -g remain-on-exit-format "#[fg=colour244]__PLACEHOLDER__"
set -g pane-border-style "fg=colour238"

# Title on top of the session shown on the right (the panel writes @argus_title
# only when the session or its status changes).
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format "#{?#{==:#{@argus_role},agent},#{@argus_title},}"
set -g pane-active-border-style "fg=colour75"

# Ctrl+\ switches focus between the list and the session (and leaves zoom).
bind -n C-\\ if -F "#{==:#{@argus_role},panel}" "select-pane -t :main.1" "select-pane -t :main.0"

# When a session ends, tell the panel (one sh per event, no external programs).
set-hook -g pane-exited "run-shell -b 'echo 1 > __STATE_DIR__/_tmux'"
set-hook -g pane-died "run-shell -b 'echo 1 > __STATE_DIR__/_tmux'"
