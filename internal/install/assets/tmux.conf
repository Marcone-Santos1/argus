# Argus tmux configuration. Written by `argus install`; do not edit.
# Its own server (tmux -L argus): it does not interfere with any other tmux.

# No prefix and no status bar: the only global key is Ctrl+\.
set -g prefix None
unbind C-b
set -g status off

# The terminal behaves as it does outside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 0
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g bell-action any
set -g focus-events on
set -g history-limit 50000
set -g window-size latest

# Fixed window names (Argus finds windows by name).
set -g automatic-rename off
set -g allow-rename off

# Panel and the empty space on the right.
set -g remain-on-exit-format "#[fg=colour244]__PLACEHOLDER__"
set -g pane-border-style "fg=#3b4048"

# Titles on top of the panel and of the session shown on the right (the panel
# writes @argus_title only when the text changes).
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format "#{@argus_title}#{?#{@argus_flash},#[align=right]#[fg=#98c379#,bold] #{@argus_flash} ,}"

# Mouse selection (drag, double or triple click) copies and stays where it
# is; tmux's default leaves copy mode, which jumps to the bottom. A short
# "Copied" shows at the top right of the session (@argus_flash, cleared by a
# delayed tmux command: no process).
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear \; set -p @argus_flash "__COPIED__" \; run -b -d 1.2 -C 'set -pu -t "#{pane_id}" @argus_flash'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear \; set -p @argus_flash "__COPIED__" \; run -b -d 1.2 -C 'set -pu -t "#{pane_id}" @argus_flash'
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear \; set -p @argus_flash "__COPIED__" \; run -b -d 1.2 -C 'set -pu -t "#{pane_id}" @argus_flash'
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear \; set -p @argus_flash "__COPIED__" \; run -b -d 1.2 -C 'set -pu -t "#{pane_id}" @argus_flash'
if-shell "command -v pbcopy >/dev/null" "set -g copy-command pbcopy"

# Quieter copy-mode colors (tmux's default is yellow).
set -g mode-style "bg=#2b313c,fg=default"
set -g copy-mode-selection-style "bg=#3d5a8c,fg=#ffffff"
set -g copy-mode-position-style "bg=default,fg=#6c717c"
set -g pane-active-border-style "fg=#4d6491"

# Ctrl+\ switches focus between the list and the session (and leaves zoom).
bind -n C-\\ if -F "#{==:#{@argus_role},panel}" "select-pane -t :main.1" "select-pane -t :main.0"

# A click on a tab of the new look (a range in the status line) tells the
# panel which session it was.
bind -n MouseDown1Status run-shell -b 'echo "#{mouse_status_range}" > __STATE_DIR__/_tab'

# When a session ends, tell the panel (one sh per event, no external programs).
set-hook -g pane-exited "run-shell -b 'echo 1 > __STATE_DIR__/_tmux'"
set-hook -g pane-died "run-shell -b 'echo 1 > __STATE_DIR__/_tmux'"
