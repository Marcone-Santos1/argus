name: release

# Pushing a tag like v0.1.0 builds the binaries and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS can build every target: darwin needs cgo (CPU counters) and clang
    # builds both architectures; linux builds are pure Go.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64/1 darwin/amd64/1 linux/amd64/0 linux/arm64/0; do
            IFS=/ read -r os arch cgo <<< "$target"
            name="argus_${VERSION#v}_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=$cgo GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/argus" ./cmd/argus
            cp LICENSE README.md README.pt-BR.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/checksums.txt --generate-notes --title "${{ github.ref_name }}"
